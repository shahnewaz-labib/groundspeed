name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Analyze · Test · Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold platform projects (generated in CI, never locally)
        run: flutter create . --platforms android,ios --org com.shahnewaz --project-name groundspeed

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Ensure signing keystore exists
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "cn=Android Debug,o=Android,c=US"

      - name: Build release APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Collect artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk groundspeed-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: groundspeed-android
          path: groundspeed-release.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: groundspeed-obfuscation-symbols
          path: build/symbols
          if-no-files-found: error
