name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    name: Build & publish release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Stamp version from tag
        run: |
          VER="${GITHUB_REF_NAME#v}"
          sed -i -E "s/^version:.*$/version: ${VER}+${GITHUB_RUN_NUMBER}/" pubspec.yaml
          echo "Building version $(grep '^version:' pubspec.yaml)"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold platform projects (generated in CI, never locally)
        run: flutter create . --platforms android,ios --org com.shahnewaz --project-name groundspeed

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Ensure signing keystore exists
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "cn=Android Debug,o=Android,c=US"

      - name: Build universal release APK
        run: flutter build apk --release

      - name: Build per-ABI release APKs
        run: flutter build apk --release --split-per-abi

      - name: Collect artifacts + checksums
        run: |
          TAG="${GITHUB_REF_NAME}"
          cp build/app/outputs/flutter-apk/app-release.apk "groundspeed-${TAG}-universal.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "groundspeed-${TAG}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "groundspeed-${TAG}-armeabi-v7a.apk"
          shasum -a 256 "groundspeed-${TAG}-universal.apk" > "groundspeed-${TAG}-universal.apk.sha256"
          shasum -a 256 "groundspeed-${TAG}-arm64-v8a.apk" > "groundspeed-${TAG}-arm64-v8a.apk.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          UNI="groundspeed-${TAG}-universal.apk"
          ARM="groundspeed-${TAG}-arm64-v8a.apk"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$UNI"* "$ARM"* "groundspeed-${TAG}-armeabi-v7a.apk" --clobber
          else
            gh release create "$TAG" \
              "$ARM" "${ARM}.sha256" \
              "$UNI" "${UNI}.sha256" \
              "groundspeed-${TAG}-armeabi-v7a.apk" \
              --title "Groundspeed $TAG" \
              --notes "Precision GNSS ground-speed instrument.

              **Install:** sideload \`$ARM\` (any phone from ~2016 onward; smaller download) or \`$UNI\` if unsure.
              Verify integrity with the \`.sha256\` files.
              Built by GitHub Actions from tag \`$TAG\`."
          fi
